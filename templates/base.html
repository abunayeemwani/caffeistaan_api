<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Caffiestaan Operations{% endblock %}</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        terracotta: '#C26D43',
                        espresso: '#1A1412',
                        cream: '#FBF9F5',
                        cardBg: '#231D1A',
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js (Client reactivity & audio state) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <!-- HTMX (Auto-polling & live partial swaps) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="bg-gray-950 text-gray-100 antialiased min-h-screen">
    {% block content %}
    {% endblock %}
</body>
</html>
